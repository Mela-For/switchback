name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --ci

      # functions/ is a separate TypeScript project (Cloud Functions) with its own dependencies.
      - run: npm ci
        working-directory: functions

      - run: npx tsc --noEmit
        working-directory: functions

      - run: npm test -- --ci
        working-directory: functions
